server:
  port: ${PORT:8080}

spring:
  application:
    name: smash-club-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/smashclub}
      auto-index-creation: true

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,https://smash-club.vercel.app}

logging:
  level:
    root: INFO
    com.smashclub: DEBUG
    org.springframework.data.mongodb.core.MongoTemplate: INFO
