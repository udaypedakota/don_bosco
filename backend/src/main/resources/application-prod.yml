server:
  port: ${PORT:8080}

spring:
  application:
    name: smash-club-backend
  data:
    mongodb:
      uri: ${MONGODB_URI}
      auto-index-creation: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://smash-club.vercel.app}

logging:
  level:
    root: INFO
    com.smashclub: INFO
